name: Build and release WacomLite

on:
  push:
    branches: [main]
    paths:
      - src/AssemblyInfo.cs
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wacomlite-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout exact public repository commit
        run: |
          $ErrorActionPreference = 'Stop'
          git init .
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          git fetch --depth 1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Fetch failed' }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Checkout failed' }

      - name: Build portable executable
        run: |
          $ErrorActionPreference = 'Stop'
          & .\Build.ps1 -Package
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          $report = Join-Path $PWD 'data\build\selftest.txt'
          $exe = Join-Path $PWD 'WacomLite.exe'
          $p = Start-Process -FilePath $exe -ArgumentList @('--selftest', ('"' + $report + '"')) -Wait -PassThru
          Get-Content -LiteralPath $report
          if ($p.ExitCode -ne 0) { throw 'Native self-tests failed' }

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content -Raw -Encoding UTF8 src\AssemblyInfo.cs
          $match = [regex]::Match($source, 'AssemblyFileVersion\("(\d+\.\d+\.\d+)\.\d+"\)')
          if (-not $match.Success) { throw 'Version not found' }
          $version = $match.Groups[1].Value
          $tag = 'v' + $version
          $releasesJson = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read releases' }
          if (@($releasesJson | ConvertFrom-Json | Where-Object tag_name -eq $tag).Count -gt 0) {
            Write-Output "Release $tag already exists; preserving it."
            exit 0
          }
          $readme = Get-Content -Raw -Encoding UTF8 README.md
          $notes = [regex]::Match($readme, '(?s)## v' + [regex]::Escape($version) + '[^\r\n]*\r?\n(.*?)(?=\r?\n## |\z)')
          if (-not $notes.Success) { throw 'Matching release notes missing from README' }
          $notes.Groups[1].Value.Trim() | Set-Content -Encoding UTF8 data\build\release-notes.txt
          $asset = "data\build\WacomLite-$tag-win-x64.zip"
          Copy-Item data\build\WacomLite-portable.zip $asset
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $asset -Leaf)" | Set-Content -Encoding ASCII data\build\SHA256SUMS.txt
          gh release create $tag $asset data\build\SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "WacomLite $tag" --notes-file data\build\release-notes.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
